<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Resend Cube</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Inter:wght@400;450;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ground:#000;
    --ink:#f2f2f2;
    --muted:#9b9b9b;
    --nav-ink:#d9d9d9;
    --hair:rgba(255,255,255,.1);
    --shell:1480px;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    background:var(--ground);
    color:var(--ink);
    font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }
  a{text-decoration:none;color:inherit}

  /* ---------- top navigation ---------- */
  .nav{
    position:relative;
    z-index:3;
    display:flex;
    align-items:center;
    gap:32px;
    max-width:var(--shell);
    margin:0 auto;
    padding-inline:28px;
    padding-block:22px;
  }

  .brand{
    font-size:23px;
    font-weight:500;
    letter-spacing:-.02em;
    margin-right:auto;
  }
  /* the wordmark's leading stroke, approximating the real mark */
  .brand span{
    display:inline-block;
    transform:scaleX(-1);
    margin-right:-.04em;
  }

  .nav__links{
    display:flex;
    align-items:center;
    gap:26px;
    font-size:14.5px;
    color:var(--nav-ink);
  }
  .nav__links a{
    display:inline-flex;
    align-items:center;
    gap:5px;
    padding-block:4px;
    transition:color .18s ease;
  }
  .nav__links a:hover{color:#fff}
  .chev{width:9px;height:9px;opacity:.6;flex:0 0 auto}

  .nav__actions{
    display:flex;
    align-items:center;
    gap:20px;
    margin-left:auto;
    font-size:14.5px;
  }
  .nav__login{color:var(--nav-ink)}
  .nav__login:hover{color:#fff}
  .nav__cta{
    background:#2b2b2b;
    border:1px solid rgba(255,255,255,.09);
    color:#fff;
    font-weight:450;
    padding:9px 19px;
    border-radius:999px;
    transition:background .18s ease;
  }
  .nav__cta:hover{background:#383838}

  /* ---------- hero ---------- */
  .hero{
    position:relative;
    min-height:calc(100svh - 82px);
    display:flex;
    align-items:center;
    gap:48px;
    max-width:var(--shell);
    margin:0 auto;
    padding-inline:clamp(28px, 6vw, 92px);
    padding-bottom:3vh;
  }

  /* the raking floor sweep and the pool behind the cube */
  .glow{
    position:absolute;
    inset:-30% -25%;
    z-index:0;
    pointer-events:none;
    background:
      linear-gradient(99deg, transparent 44%, rgba(255,255,255,.05) 51.5%, transparent 59%),
      linear-gradient(97deg, transparent 56%, rgba(255,255,255,.022) 62%, transparent 68%),
      radial-gradient(42% 40% at 68% 44%, rgba(255,255,255,.045), transparent 70%);
  }

  .copy{position:relative;z-index:2;flex:1 1 auto;max-width:36rem}

  .pill{
    display:inline-flex;
    align-items:center;
    gap:9px;
    font-size:14px;
    color:#e2e2e2;
    padding:8px 17px;
    border-radius:999px;
    border:1px solid transparent;
    /* gradient hairline: fill paints to the padding box, gradient to the border box */
    background-image:
      linear-gradient(#0b0b0b, #0b0b0b),
      linear-gradient(96deg, #3f8f82 0%, #6b5bb5 48%, #b06a55 100%);
    background-origin:border-box;
    background-clip:padding-box, border-box;
    margin-bottom:34px;
  }
  .pill span{opacity:.75}

  h1{
    font-family:"Instrument Serif",Georgia,"Times New Roman",serif;
    font-weight:400;
    font-size:clamp(3.2rem,6.4vw,5.9rem);
    line-height:.96;
    letter-spacing:-.008em;
    margin:0 0 26px;
    background:linear-gradient(176deg,#ffffff 22%,#8e8e8e 100%);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    text-wrap:balance;
  }

  .sub{
    margin:0 0 42px;
    font-size:clamp(1rem,1.15vw,1.09rem);
    line-height:1.52;
    color:var(--muted);
  }

  .actions{display:flex;align-items:center;gap:30px}
  .btn{
    background:#1c1c1c;
    border:1px solid rgba(255,255,255,.09);
    color:#fff;
    font:inherit;
    font-size:.94rem;
    font-weight:450;
    padding:12px 24px;
    border-radius:12px;
    cursor:pointer;
    transition:background .18s ease;
  }
  .btn:hover{background:#292929}
  .link{color:#cfcfcf;font-size:.94rem;font-weight:450}
  .link:hover{color:#fff}

  /* ---------- the cube stage ---------- */
  .stage{
    position:relative;
    z-index:1;
    flex:0 0 auto;
    width:min(46vw, 680px);
    height:min(38vw, 540px);
    /* the real page desaturates the whole WebGL layer */
    filter:grayscale(1);
    opacity:0;
    transform:scale(.86);
    animation:rise 1.7s cubic-bezier(.16,1,.3,1) .15s forwards;
  }
  .stage canvas{display:block;width:100%;height:100%}

  @keyframes rise{to{opacity:1;transform:scale(1)}}

  @media (max-width:1180px){
    .nav__links{display:none}
  }
  @media (max-width:980px){
    .hero{
      flex-direction:column;
      justify-content:center;
      text-align:center;
      gap:12px;
      padding-block:40px 64px;
    }
    .copy{max-width:100%;order:2}
    .actions{justify-content:center}
    .stage{order:1;width:min(92vw,560px);height:min(72vw,440px)}
  }
  @media (max-width:560px){
    .nav{padding-inline:20px}
    .hero{padding-inline:20px}
    .nav__actions{gap:14px}
    .stage{height:min(80vw,360px)}
  }
  @media (prefers-reduced-motion:reduce){
    .stage{animation:none;opacity:1;transform:none}
  }
</style>
</head>
<body>

<header class="nav">
  <a class="brand" href="#"><span>R</span>esend</a>

  <nav class="nav__links">
    <a href="#">Features <svg class="chev" viewBox="0 0 10 10" fill="none" aria-hidden="true"><path d="M2 4l3 3 3-3" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg></a>
    <a href="#">Company <svg class="chev" viewBox="0 0 10 10" fill="none" aria-hidden="true"><path d="M2 4l3 3 3-3" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg></a>
    <a href="#">Enterprise <svg class="chev" viewBox="0 0 10 10" fill="none" aria-hidden="true"><path d="M2 4l3 3 3-3" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg></a>
    <a href="#">Help <svg class="chev" viewBox="0 0 10 10" fill="none" aria-hidden="true"><path d="M2 4l3 3 3-3" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg></a>
    <a href="#">Docs <svg class="chev" viewBox="0 0 10 10" fill="none" aria-hidden="true"><path d="M2 4l3 3 3-3" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg></a>
    <a href="#">AI <svg class="chev" viewBox="0 0 10 10" fill="none" aria-hidden="true"><path d="M2 4l3 3 3-3" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg></a>
    <a href="#">Pricing</a>
  </nav>

  <div class="nav__actions">
    <a class="nav__login" href="#">Log in</a>
    <a class="nav__cta" href="#">Get started</a>
  </div>
</header>

<section class="hero">
  <div class="glow" aria-hidden="true"></div>

  <div class="copy">
    <a class="pill" href="#">Join us at Resend Forward <span aria-hidden="true">›</span></a>
    <h1>Email for developers</h1>
    <p class="sub">The best way to reach humans instead of spam folders.<br>Deliver transactional and marketing emails at scale.</p>
    <div class="actions">
      <button class="btn" type="button">Get started</button>
      <a class="link" href="#">Documentation</a>
    </div>
  </div>

  <div class="stage" id="stage" aria-label="Rotating 3D cube" role="img"></div>
</section>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
  const stage = document.getElementById('stage');
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

  // Never fail silently: a blank stage is indistinguishable from a black cube.
  if (typeof THREE === 'undefined') {
    stage.style.filter = 'none';
    stage.style.animation = 'none';
    stage.style.opacity = '1';
    stage.innerHTML = '<p style="display:grid;place-items:center;height:100%;margin:0;'
      + 'font-size:13px;line-height:1.6;color:#e06a5a;text-align:center">'
      + 'Three.js failed to load.<br>Check the network tab for the cdnjs request.</p>';
    return;
  }

  // ---- tunables --------------------------------------------------------
  const CFG = {
    gap:          1.052,  // centre-to-centre spacing of cubies (1 = touching)
    radius:       0.098,  // corner rounding of each cubie
    spinSpeed:    0.34,   // radians / second around the tilted axis
    tiltX:        0.48,
    tiltZ:        0.06,
    exposure:     0.80,
    twistEvery: [0.18, 0.55], // seconds of stillness between slice turns
    twistTime:   0.34,    // seconds for one 90 degree turn
    doubleOdds:  0.18,    // chance a turn goes 180 instead of 90
    fitMargin:    1.06,   // breathing room around the cube, 1 = tight fit
    keyPower:     2.35,   // brightness of the near key light
    keyRange:     15,     // world units at which the key reaches zero
    keyDecay:     1.75,   // how sharply it falls off across that range
  };
  // ----------------------------------------------------------------------

  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: 'high-performance' });
  renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = CFG.exposure;
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  stage.appendChild(renderer.domElement);

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(30, 1, 0.1, 100);
  camera.position.set(0, 0, 11);

  // A slice turn rotates about an axis through the centre, so every corner keeps
  // its distance from the origin -- the bounding sphere never changes size.
  const FIT_RADIUS = Math.sqrt(3) * (CFG.gap + 0.5);

  function fitCamera() {
    const vFov = camera.fov * Math.PI / 180;
    const hFov = 2 * Math.atan(Math.tan(vFov / 2) * camera.aspect);
    // fit against whichever axis is tighter, so it never crops on either
    const fov = Math.min(vFov, hFov);
    camera.position.z = (FIT_RADIUS * CFG.fitMargin) / Math.sin(fov / 2);
  }

  // ---- procedural texture helpers -------------------------------------
  const MAX_ANISO = renderer.capabilities.getMaxAnisotropy();

  function canvasTex(size, paint, repeat) {
    const c = document.createElement('canvas');
    c.width = c.height = size;
    paint(c.getContext('2d'), size);
    const t = new THREE.CanvasTexture(c);
    t.wrapS = t.wrapT = THREE.RepeatWrapping;
    // without this, fine line/speckle detail aliases into hard white scratches
    t.anisotropy = MAX_ANISO;
    t.minFilter = THREE.LinearMipmapLinearFilter;
    t.generateMipmaps = true;
    if (repeat) t.repeat.set(repeat, repeat);
    return t;
  }

  // Every finish bakes its pattern and a soft inset edge shadow into one map.
  // The edge shading is what sells contact between neighbouring cubies -- a
  // shadow map can't resolve a seam this tight.
  function bakedMap(paint) {
    return canvasTex(512, (g, s) => {
      paint(g, s);
      const b = s * 0.17;
      const band = (x0, y0, x1, y1) => {
        const q = g.createLinearGradient(x0, y0, x1, y1);
        q.addColorStop(0, 'rgba(0,0,0,0.5)');
        q.addColorStop(1, 'rgba(0,0,0,0)');
        return q;
      };
      g.fillStyle = band(0, 0, b, 0);      g.fillRect(0, 0, b, s);
      g.fillStyle = band(s, 0, s - b, 0);  g.fillRect(s - b, 0, b, s);
      g.fillStyle = band(0, 0, 0, b);      g.fillRect(0, 0, s, b);
      g.fillStyle = band(0, s, 0, s - b);  g.fillRect(0, s - b, s, b);
    });
  }

  const flat = c => (g, s) => { g.fillStyle = c; g.fillRect(0, 0, s, s); };

  // Carbon twill: a checkerboard of cells whose diagonal ribs alternate direction.
  const weavePaint = (g, s) => {
    g.fillStyle = '#8c8c8c';
    g.fillRect(0, 0, s, s);
    const n = 18, cell = s / n;
    g.lineWidth = 1.15;
    for (let cy = 0; cy < n; cy++) {
      for (let cx = 0; cx < n; cx++) {
        const x0 = cx * cell, y0 = cy * cell;
        const up = (cx + cy) % 2 === 0;
        g.save();
        g.beginPath(); g.rect(x0, y0, cell, cell); g.clip();
        const ribs = (offset, style) => {
          g.strokeStyle = style;
          for (let k = -cell + offset; k < cell * 2; k += 3) {
            g.beginPath();
            if (up) { g.moveTo(x0 + k, y0); g.lineTo(x0 + k + cell, y0 + cell); }
            else    { g.moveTo(x0 + k, y0 + cell); g.lineTo(x0 + k + cell, y0); }
            g.stroke();
          }
        };
        ribs(0, 'rgba(255,255,255,0.5)');
        ribs(1.5, 'rgba(0,0,0,0.42)');
        g.restore();
      }
    }
  };

  // Ventilation grille: dark circular holes punched through a lighter panel.
  const perfPaint = (g, s) => {
    g.fillStyle = '#d2d2d2';
    g.fillRect(0, 0, s, s);
    const step = 17, r = 5.4;
    for (let y = step / 2; y < s + step; y += step * 0.87) {
      for (let x = step / 2; x < s + step; x += step) {
        const off = (Math.round(y / (step * 0.87))) % 2 ? step / 2 : 0;
        const cx = (x + off) % s;
        const ring = g.createRadialGradient(cx, y, r * 0.25, cx, y, r);
        ring.addColorStop(0, '#070707');
        ring.addColorStop(0.72, '#141414');
        ring.addColorStop(1, 'rgba(210,210,210,0)');
        g.fillStyle = ring;
        g.beginPath(); g.arc(cx, y, r, 0, 6.283); g.fill();
      }
    }
  };

  // Fine bright dust over a dark panel.
  const dustPaint = (g, s) => {
    g.fillStyle = '#3a3a3a';
    g.fillRect(0, 0, s, s);
    for (let i = 0; i < 9000; i++) {
      g.fillStyle = 'rgba(255,255,255,' + (0.25 + Math.random() * 0.6) + ')';
      g.beginPath();
      g.arc(Math.random() * s, Math.random() * s, Math.random() * 1.1 + 0.25, 0, 6.283);
      g.fill();
    }
  };

  const weaveMap = bakedMap(weavePaint);
  const perfMap  = bakedMap(perfPaint);
  const dustMap  = bakedMap(dustPaint);
  const plainMap = bakedMap(flat('#ffffff'));
  [weaveMap, perfMap, dustMap, plainMap].forEach(t => { t.encoding = THREE.sRGBEncoding; });

  // greyscale versions drive roughness / relief
  const weaveRough = canvasTex(512, weavePaint);
  const perfRough  = canvasTex(512, perfPaint);
  const dustRough  = canvasTex(512, dustPaint);

  // ---- environment: a generated softbox, PMREM'd for the reflections ---
  const envSource = canvasTex(1024, (g, s) => {
    const h = s / 2;
    const bg = g.createLinearGradient(0, 0, 0, h);
    bg.addColorStop(0, '#1c1c1c');
    bg.addColorStop(0.55, '#0a0a0a');
    bg.addColorStop(1, '#040404');
    g.fillStyle = bg;
    g.fillRect(0, 0, s, h);

    const blob = (cx, cy, rx, ry, a) => {
      const rg = g.createRadialGradient(cx, cy, 0, cx, cy, rx);
      rg.addColorStop(0, 'rgba(255,255,255,' + a + ')');
      rg.addColorStop(1, 'rgba(255,255,255,0)');
      g.save();
      g.translate(cx, cy);
      g.scale(1, ry / rx);
      g.translate(-cx, -cy);
      g.fillStyle = rg;
      g.fillRect(0, 0, s, h);
      g.restore();
    };
    blob(s * 0.28, h * 0.26, s * 0.52, h * 0.70, 0.40); // key softbox
    blob(s * 0.76, h * 0.42, s * 0.30, h * 0.52, 0.15); // rim
    blob(s * 0.50, h * 0.88, s * 0.45, h * 0.30, 0.07); // floor bounce
  });
  envSource.mapping = THREE.EquirectangularReflectionMapping;

  const pmrem = new THREE.PMREMGenerator(renderer);
  pmrem.compileEquirectangularShader();
  scene.environment = pmrem.fromEquirectangular(envSource).texture;
  envSource.dispose();
  pmrem.dispose();

  // ---- lights ----------------------------------------------------------
  // A CLOSE point light, not a distant directional one. Directional rays are
  // parallel, so they light a whole face evenly; a nearby source changes both
  // its direction and its distance across a single face, which is what gives
  // each tile its gradient and lets the far side of the cube fall to nothing.
  const key = new THREE.PointLight(0xffffff, CFG.keyPower, CFG.keyRange, CFG.keyDecay);
  key.position.set(-3.0, 2.7, 3.7);
  key.castShadow = true;
  key.shadow.mapSize.set(1024, 1024);   // point lights render 6 faces
  key.shadow.camera.near = 0.5;
  key.shadow.camera.far = 20;
  key.shadow.radius = 4;
  key.shadow.bias = -0.0006;
  key.shadow.normalBias = 0.025;
  scene.add(key);

  const rim = new THREE.DirectionalLight(0xffffff, 0.13);
  rim.position.set(6, 1.5, -4);
  scene.add(rim);

  const fill = new THREE.DirectionalLight(0xffffff, 0.035);
  fill.position.set(1, -4, 3);
  scene.add(fill);

  scene.add(new THREE.AmbientLight(0xffffff, 0.016));

  // ---- rounded box geometry (RoundedBoxGeometry isn't in the core UMD) --
  function roundedBox(size, radius, seg) {
    const geo = new THREE.BoxGeometry(size, size, size, seg, seg, seg);
    const pos = geo.attributes.position;
    const nor = geo.attributes.normal;
    const half = size / 2;
    const inner = half - radius;
    const v = new THREE.Vector3();
    const inr = new THREE.Vector3();

    for (let i = 0; i < pos.count; i++) {
      v.fromBufferAttribute(pos, i);
      inr.set(
        Math.max(-inner, Math.min(inner, v.x)),
        Math.max(-inner, Math.min(inner, v.y)),
        Math.max(-inner, Math.min(inner, v.z))
      );
      const dir = v.clone().sub(inr).normalize();
      v.copy(inr).addScaledVector(dir, radius);
      pos.setXYZ(i, v.x, v.y, v.z);
      nor.setXYZ(i, dir.x, dir.y, dir.z);
    }
    pos.needsUpdate = true;
    nor.needsUpdate = true;
    return geo;
  }

  // The contrast in the reference comes from splitting the set in two:
  // smooth dielectric panels stay near-black because they only reflect a dark
  // room, while TEXTURED metal flares bright. Texture is what stops a bright
  // metal face from clipping to flat white, so only textured finishes go metal.
  const finishes = [
    // matte panel -- stays black
    new THREE.MeshPhysicalMaterial({
      color: 0x090909, roughness: 0.92, metalness: 0.05,
      map: plainMap, envMapIntensity: 0.5,
    }),
    // deep gloss panel -- near-pure black with a crisp bevel highlight
    new THREE.MeshPhysicalMaterial({
      color: 0x040404, roughness: 0.46, metalness: 0.1,
      clearcoat: 0.4, clearcoatRoughness: 0.3,
      map: plainMap, envMapIntensity: 0.6,
    }),
    // carbon weave -- the bright silver tiles
    new THREE.MeshPhysicalMaterial({
      color: 0x4f4f4f, metalness: 0.92, roughness: 0.47,
      map: weaveMap, envMapIntensity: 0.62,
      roughnessMap: weaveRough, bumpMap: weaveRough, bumpScale: 0.0035,
    }),
    // perforated grille
    new THREE.MeshPhysicalMaterial({
      color: 0x3e3e3e, metalness: 0.85, roughness: 0.52,
      map: perfMap, envMapIntensity: 0.55,
      roughnessMap: perfRough, bumpMap: perfRough, bumpScale: 0.016,
    }),
    // dusted metal
    new THREE.MeshPhysicalMaterial({
      color: 0x2a2a2a, metalness: 0.8, roughness: 0.54,
      map: dustMap, envMapIntensity: 0.5,
      roughnessMap: dustRough, bumpMap: dustRough, bumpScale: 0.0025,
    }),
  ];

  // Weighted so matte panels dominate and the perforated grilles read as a
  // recurring feature rather than a rarity. Index order matches `finishes`.
  const FINISH_WEIGHTS = [0.34, 0.20, 0.16, 0.22, 0.08];
  function pickFinish() {
    let r = Math.random();
    for (let i = 0; i < FINISH_WEIGHTS.length; i++) {
      r -= FINISH_WEIGHTS[i];
      if (r <= 0) return finishes[i];
    }
    return finishes[0];
  }

  // ---- build the 3x3x3 lattice ----------------------------------------
  const pivot = new THREE.Group();   // holds the fixed tilt
  const spin = new THREE.Group();    // continuously rotates
  pivot.add(spin);
  scene.add(pivot);
  pivot.rotation.x = CFG.tiltX;
  pivot.rotation.z = CFG.tiltZ;

  const geo = roundedBox(1, CFG.radius, 10);
  const cubies = [];

  for (let x = -1; x <= 1; x++) {
    for (let y = -1; y <= 1; y++) {
      for (let z = -1; z <= 1; z++) {
        // each of the six faces gets its own finish, like the reference
        const mats = [];
        for (let f = 0; f < 6; f++) mats.push(pickFinish());

        const mesh = new THREE.Mesh(geo, mats);
        mesh.castShadow = mesh.receiveShadow = true;
        mesh.position.set(x * CFG.gap, y * CFG.gap, z * CFG.gap);
        spin.add(mesh);

        cubies.push(mesh);
      }
    }
  }

  // ---- slice turns -----------------------------------------------------
  // A real Rubik's turn: grab the nine cubies sharing a coordinate, parent them
  // to a temporary pivot at the cube's centre, rotate the pivot 90/180 degrees,
  // then hand them back to the lattice and snap off the float drift.
  const rand = (a, b) => a + Math.random() * (b - a);
  const AXIS_NAMES = ['x', 'y', 'z'];
  const QUARTER = Math.PI / 2;

  let idle = 0.5;     // seconds until the next turn starts
  let turn = null;    // the turn in flight, if any

  function startTurn() {
    const axis = AXIS_NAMES[(Math.random() * 3) | 0];
    const slice = ((Math.random() * 3) | 0) - 1;           // -1, 0 or 1

    const members = cubies.filter(
      m => Math.round(m.position[axis] / CFG.gap) === slice
    );
    if (members.length !== 9) { idle = 0.2; return; }       // drifted: skip a beat

    const pivot = new THREE.Group();
    spin.add(pivot);
    for (const m of members) pivot.attach(m);

    const quarters = Math.random() < CFG.doubleOdds ? 2 : 1;
    turn = {
      pivot, members, axis,
      angle: QUARTER * quarters * (Math.random() < 0.5 ? 1 : -1),
      t: 0,
      dur: CFG.twistTime * quarters,
    };
  }

  function finishTurn() {
    const { pivot, members, axis, angle } = turn;
    pivot.rotation[axis] = angle;
    pivot.updateMatrixWorld(true);

    for (const m of members) {
      spin.attach(m);
      // snap position back onto the lattice
      m.position.set(
        Math.round(m.position.x / CFG.gap) * CFG.gap,
        Math.round(m.position.y / CFG.gap) * CFG.gap,
        Math.round(m.position.z / CFG.gap) * CFG.gap
      );
      // snap orientation: after an exact quarter turn the rotation matrix is a
      // signed permutation, so rounding its elements removes accumulated error
      const mtx = new THREE.Matrix4().makeRotationFromQuaternion(m.quaternion);
      for (let i = 0; i < 16; i++) mtx.elements[i] = Math.round(mtx.elements[i]);
      m.quaternion.setFromRotationMatrix(mtx);
    }

    spin.remove(pivot);
    turn = null;
    idle = rand(CFG.twistEvery[0], CFG.twistEvery[1]);
  }

  // slow start, slow stop — a turn that eases at both ends reads as mechanical
  const easeInOut = t => t < 0.5
    ? 4 * t * t * t
    : 1 - Math.pow(-2 * t + 2, 3) / 2;

  // ---- loop ------------------------------------------------------------
  let last = performance.now();

  function resize() {
    const w = stage.clientWidth, h = stage.clientHeight;
    if (!w || !h) return;
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    fitCamera();
    camera.updateProjectionMatrix();
  }

  function frame(now) {
    const dt = Math.min((now - last) / 1000, 0.05);
    last = now;

    spin.rotation.y += CFG.spinSpeed * dt;
    spin.rotation.x = Math.sin(now / 5200) * 0.07;

    if (turn) {
      turn.t = Math.min(1, turn.t + dt / turn.dur);
      turn.pivot.rotation[turn.axis] = easeInOut(turn.t) * turn.angle;
      if (turn.t >= 1) finishTurn();
    } else {
      idle -= dt;
      if (idle <= 0) startTurn();
    }

    renderer.render(scene, camera);
    if (!reduced) requestAnimationFrame(frame);
  }

  new ResizeObserver(resize).observe(stage);
  resize();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
